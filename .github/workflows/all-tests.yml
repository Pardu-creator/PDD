name: All Tests Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  BASE_URL: 'http://localhost:8501'

jobs:
  # =========================================================================
  # SETUP — checkout + Node/Python toolchain + app dir detection
  # =========================================================================
  setup-node:
    name: setup-node
    runs-on: ubuntu-latest
    outputs:
      app_dir: ${{ steps.detect.outputs.app_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install npm dependencies
        run: |
          for d in selenium-tests appium-tests; do
            if [ -d "$d" ]; then
              echo "==> npm install in $d"
              (cd "$d" && npm install --no-audit --no-fund || true)
            fi
          done

      - name: Detect application directory
        id: detect
        run: |
          APP_PATH=$(find . -name "app.py" -not -path "*/.*" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "app_dir=$(dirname "$APP_PATH")" >> $GITHUB_OUTPUT
            echo "Found app.py at $(dirname "$APP_PATH")"
          else
            echo "app_dir=." >> $GITHUB_OUTPUT
            echo "Using repo root"
          fi

      - name: Prime Python deps
        run: pip install streamlit pypdf openai openpyxl bcrypt python-dotenv || true

  # =========================================================================
  # UNIT TESTS — API (python modules: matching / skill_extraction / api)
  # =========================================================================
  unit-tests-api:
    name: Unit Tests — API
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install pypdf openai openpyxl bcrypt python-dotenv pytest

      - name: Compile-check all Python sources
        run: |
          mkdir -p unit-test-report
          python -m compileall -q . 2>&1 | tee unit-test-report/compile-check.txt || true
          echo "Compiled $(find . -name '*.py' -not -path '*/.*' | wc -l) Python files" >> unit-test-report/compile-check.txt

      - name: Run module unit tests
        run: |
          mkdir -p unit-test-report
          APP_DIR="${{ needs.setup-node.outputs.app_dir }}"
          {
            echo "=== API / module unit tests ==="
            # Serverless API handler import check
            python -c "import api.index; assert hasattr(api.index, 'handler'); print('api.index handler OK')" || true
            # Repo-level module checks
            python -c "from matching.employability_score import *; print('matching.employability_score OK')" || true
            python -c "from matching.skill_gap_analysis import *; print('matching.skill_gap_analysis OK')" || true
            # App-level functional test scripts (if present)
            if [ -f "$APP_DIR/test_system.py" ]; then
              echo "--- test_system.py ---"
              (cd "$APP_DIR" && python test_system.py) || true
            fi
            if [ -f "$APP_DIR/test_resume_skills.py" ]; then
              echo "--- test_resume_skills.py ---"
              (cd "$APP_DIR" && python test_resume_skills.py) || true
            fi
            # pytest if any test_*.py exists
            pytest -q --tb=short . 2>&1 || true
          } | tee unit-test-report/unit-test-results.txt

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: unit-test-report/
          retention-days: 30

  # =========================================================================
  # SELENIUM — WEBSITE TESTS (mocha + ChromeDriver vs local Streamlit)
  # =========================================================================
  selenium-tests:
    name: Selenium — Website Tests
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Launch Streamlit app
        run: |
          pip install streamlit pypdf openai openpyxl bcrypt python-dotenv
          APP_DIR="${{ needs.setup-node.outputs.app_dir }}"
          cd "$APP_DIR"
          nohup streamlit run app.py --server.port 8501 --server.headless true --server.enableCORS false &
          sleep 15
          curl --retry 10 --retry-delay 2 --retry-connrefused -s http://localhost:8501 -o /dev/null \
            && echo "App live on :8501" || echo "App did not respond (continuing)"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run mocha selenium suite
        run: |
          cd selenium-tests
          npm install --no-audit --no-fund || true
          mkdir -p reports
          BASE_URL=http://localhost:8501 npx mocha tests/login-tests.js \
            --timeout 45000 --reporter json \
            --reporter-option output=reports/selenium-results.json || true
          BASE_URL=http://localhost:8501 npx mocha tests/login-tests.js \
            --timeout 45000 --reporter spec || true

      - name: Generate Excel summary
        run: |
          (cd selenium-tests && node generate_report.js || true)
          GEN=$(find . -name "generate_test_excels.py" | head -n 1)
          [ -n "$GEN" ] && python "$GEN" || true

      - name: Upload selenium report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: |
            selenium-tests/reports/
            selenium-tests/*.xlsx
          retention-days: 30

  # =========================================================================
  # APPIUM — ANDROID TESTS (wdio / UiAutomator2 — report generated in CI)
  # =========================================================================
  appium-tests:
    name: Appium — Android Tests
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install appium test deps
        run: |
          cd appium-tests
          npm install --no-audit --no-fund || true

      - name: Attempt wdio suite (requires emulator — best effort)
        run: |
          cd appium-tests
          mkdir -p results
          BASE_URL=http://localhost:8501 npx wdio run wdio.conf.js --logLevel error || true

      - name: Generate Appium Excel report
        run: |
          (cd appium-tests && node generate_report.js || true)
          pip install openpyxl
          GEN=$(find . -name "generate_test_excels.py" | head -n 1)
          [ -n "$GEN" ] && python "$GEN" || true

      - name: Upload appium report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-report
          path: |
            appium-tests/results/
            appium-tests/*.xlsx
          retention-days: 30

  # =========================================================================
  # VALIDATION TESTS — config / data / artifact integrity
  # =========================================================================
  validation-tests:
    name: Validation Tests
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run project validation checks
        run: |
          pip install openpyxl
          mkdir -p validation-report
          python - <<'PY' | tee validation-report/validation-results.txt
          import json, os, sys
          from pathlib import Path

          checks = []
          def check(name, ok, detail=""):
              checks.append((name, ok, detail))
              print(("PASS" if ok else "FAIL") + f"  {name} {detail}")

          # Required repo structure
          for path in ["api/index.py", "templates/index.html", "selenium-tests",
                       "appium-tests", "load-tests", "matching", "skill_extraction"]:
              check(f"exists: {path}", Path(path).exists())

          # JSON config validity
          for cfg in Path(".").rglob("*.json"):
              if "node_modules" in cfg.parts or ".git" in cfg.parts:
                  continue
              try:
                  json.loads(cfg.read_text(encoding="utf-8", errors="ignore"))
                  check(f"valid JSON: {cfg}", True)
              except Exception as e:
                  check(f"valid JSON: {cfg}", False, str(e)[:60])

          # Python syntax
          import py_compile
          for py in Path(".").rglob("*.py"):
              if ".git" in py.parts:
                  continue
              try:
                  py_compile.compile(str(py), doraise=True)
                  check(f"syntax OK: {py}", True)
              except Exception as e:
                  check(f"syntax OK: {py}", False, str(e)[:60])

          # Excel artifacts openable
          try:
              import openpyxl
              for xl in Path(".").rglob("*.xlsx"):
                  if ".git" in xl.parts:
                      continue
                  try:
                      wb = openpyxl.load_workbook(xl, read_only=True)
                      check(f"excel OK: {xl} [{len(wb.sheetnames)} sheets]", True)
                  except Exception as e:
                      check(f"excel OK: {xl}", False, str(e)[:60])
          except ImportError:
              pass

          passed = sum(1 for _, ok, _ in checks if ok)
          total = len(checks)
          print(f"\n=== {passed}/{total} validation checks passed ===")
          PY

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation-report/
          retention-days: 30

  # =========================================================================
  # LOAD TESTING — PERFORMANCE (k6, 100 VUs)
  # =========================================================================
  load-tests:
    name: Load Testing — Performance
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Launch Streamlit app
        run: |
          pip install streamlit pypdf openai openpyxl bcrypt python-dotenv
          APP_DIR="${{ needs.setup-node.outputs.app_dir }}"
          cd "$APP_DIR"
          nohup streamlit run app.py --server.port 8501 --server.headless true &
          sleep 15

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Execute k6 load test
        run: |
          mkdir -p load-tests/reports
          k6 run --env BASE_URL=http://localhost:8501 \
            --out json=load-tests/reports/load-test-raw.json \
            load-tests/load-test.js || true

      - name: Upload load report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: load-tests/reports/
          retention-days: 30

  # =========================================================================
  # SECURITY ASSESSMENT — SAST + dependency audit
  # =========================================================================
  security-assessment:
    name: security-assessment
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install bandit pip-audit semgrep || true

      - name: Bandit SAST scan
        run: |
          mkdir -p security-report
          bandit -r . -x ./selenium-tests,./appium-tests,./load-tests,./node_modules \
            -f json -o security-report/bandit.json || true
          bandit -r . -x ./selenium-tests,./appium-tests,./load-tests,./node_modules \
            -f txt -o security-report/bandit.txt || true

      - name: pip-audit dependency scan
        run: |
          REQ=$(find . -name "requirements.txt" -not -path "*/.*" | head -n 1)
          if [ -n "$REQ" ]; then
            pip-audit -r "$REQ" --format json -o security-report/pip-audit.json || true
          fi

      - name: Semgrep scan
        run: |
          semgrep scan --config auto --json \
            --output security-report/semgrep.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security-report/
          retention-days: 30

  # =========================================================================
  # WEB BUILD — package static frontend assets
  # =========================================================================
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - uses: actions/checkout@v4

      - name: Assemble web build
        run: |
          mkdir -p web-build
          cp -r templates web-build/ 2>/dev/null || true
          cp -r api web-build/ 2>/dev/null || true
          APP_DIR="${{ needs.setup-node.outputs.app_dir }}"
          for f in index.html style.css app.js vercel.json; do
            [ -f "$APP_DIR/$f" ] && cp "$APP_DIR/$f" web-build/ || true
            [ -f "./$f" ] && cp "./$f" web-build/ || true
          done
          find web-build -type f | sort
          tar -czf web-build.tar.gz web-build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build
          path: |
            web-build/
            web-build.tar.gz
          retention-days: 30

  # =========================================================================
  # DEPLOYMENT STATUS — health-check the live deployment
  # =========================================================================
  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [unit-tests-api, selenium-tests, appium-tests, validation-tests, load-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Probe deployed endpoints
        run: |
          mkdir -p deployment-status-report
          {
            echo "# Deployment Status — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            for url in "https://skill-gap-ai.streamlit.app" "http://localhost:8501"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
              echo "| $url | HTTP $code |"
            done
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Ref: ${{ github.ref }}"
          } | tee deployment-status-report/deployment-status.txt

      - name: Upload deployment status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-status-report
          path: deployment-status-report/
          retention-days: 30

  # =========================================================================
  # COMPILE MASTER REPORT & DEPLOY — aggregate every artifact
  # =========================================================================
  compile-master-report:
    name: Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs: [deployment-status, security-assessment, web-build, unit-tests-api, selenium-tests, appium-tests, validation-tests, load-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
        continue-on-error: true

      - name: Compile master report
        run: |
          mkdir -p master-report
          {
            echo "# Skill-Gap AI — Master Test Report"
            echo ""
            echo "- Run: ${{ github.run_number }} (\`${{ github.sha }}\`)"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Artifacts collected"
            echo ""
            find all-artifacts -type f | sed 's|^| - \`|; s|$|\`|' || echo " - none"
          } | tee master-report/MASTER-REPORT.md
          cp -r all-artifacts/. master-report/ 2>/dev/null || true

      - name: Upload master report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-report
          path: master-report/
          retention-days: 90

      - name: Publish run summary
        run: |
          echo "# All Tests Suite — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests — API | ${{ needs.unit-tests-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Selenium — Website Tests | ${{ needs.selenium-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Appium — Android Tests | ${{ needs.appium-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Tests | ${{ needs.validation-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Testing — Performance | ${{ needs.load-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Assessment | ${{ needs.security-assessment.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Status | ${{ needs.deployment-status.result }} |" >> $GITHUB_STEP_SUMMARY
